<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="マイスケジュール"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>マイスケジュール</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,sans-serif}header{background:#2563eb;color:white;padding:22px 18px;border-radius:0 0 20px 20px}h1{margin:0;font-size:23px}main{max-width:650px;margin:auto;padding:15px}.tabs{display:flex;gap:7px}.tabs button{flex:1;border:0;border-radius:11px;padding:12px 4px;background:#e3eaf5;font-weight:bold}.tabs .active,.primary{background:#2563eb;color:white}.card{background:white;border-radius:16px;padding:16px;margin:13px 0;box-shadow:0 2px 12px #0000000b}h2{font-size:18px;margin:0 0 12px}label{display:block;font-size:13px;font-weight:bold;margin:12px 0 5px}input,select,textarea{width:100%;padding:12px;border:1px solid #d2d9e5;border-radius:10px;font:inherit;background:white}.row{display:flex;gap:10px}.row>div{flex:1}textarea{min-height:70px}.primary{width:100%;padding:14px;border:0;border-radius:11px;font-size:16px;font-weight:bold;margin-top:14px}.secondary,.danger{border:0;border-radius:9px;padding:8px 11px}.secondary{background:#e8effb;color:#1d4ed8}.danger{background:#fff0f0;color:#b91c1c}.event{border-left:4px solid #2563eb;background:#f8faff;padding:11px;margin:10px 0;border-radius:8px}.event.private{border-color:#16a34a}.meta,.small{font-size:12px;color:#667085;line-height:1.6}.actions{text-align:right;margin-top:8px}.hidden{display:none!important}.empty{text-align:center;padding:25px;color:#7b8495}.notice{background:#fff8e6;border:1px solid #f1dfae;border-radius:11px;padding:12px;font-size:12px;line-height:1.6}
</style></head><body><header><h1>📅 マイスケジュール</h1><div>あなたの予定をかんたん管理</div></header><main>
<nav class="tabs"><button class="active" data-tab="today">今日の予定</button><button data-tab="add">予定を登録</button><button data-tab="all">すべて</button></nav>
<section id="today"><div class="card"><h2 id="heading">今日の予定</h2><label>表示する日付</label><input id="day" type="date"><div id="todayList"></div></div></section>
<section id="add" class="hidden"><div class="card"><h2 id="formHeading">新しい予定</h2><form id="form"><label>予定の内容</label><input id="title" required maxlength="100" placeholder="例：友人と食事"><div class="row"><div><label>日付</label><input id="date" type="date" required></div><div><label>開始時間</label><input id="time" type="time" value="09:00" required></div></div><label>分類</label><select id="category"><option>プライベート</option><option>仕事</option></select><label>メモ（任意）</label><textarea id="memo" placeholder="場所や持ち物など"></textarea><p class="small">音声入力は入力欄をタップし、iPhoneキーボードのマイクを押してください。</p><button class="primary">予定を保存する</button><button type="button" id="cancel" class="secondary hidden">編集をキャンセル</button></form></div></section>
<section id="all" class="hidden"><div class="card"><h2>登録済みの予定</h2><div id="allList"></div></div></section>
<div class="card"><div class="notice"><b>通知について</b><br>この試作版は予定をSafari内に保存します。前日18:00・30分前のプッシュ通知は、通知サーバー等の追加設定が必要なため、まだ送信されません。</div><p class="small">Safariの履歴やWebサイトデータを消去すると予定が消える場合があります。大切な予定は別途控えてください。</p></div>
</main><script>
const $=x=>document.getElementById(x),KEY='myschedule.v1';let events=[],editing=null;
const today=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){try{events=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{events=[]}}
function save(){localStorage.setItem(KEY,JSON.stringify(events));render()}
function list(arr,el){if(!arr.length){el.innerHTML='<div class="empty">予定はありません</div>';return}el.innerHTML=arr.map(e=>`<div class="event ${e.category==='プライベート'?'private':''}"><b>${esc(e.date)}　${esc(e.time)}</b><div><strong>${esc(e.title)}</strong></div><div class="meta">${esc(e.category)} ${esc(e.memo)}</div><div class="actions"><button class="secondary" data-edit="${e.id}">編集</button> <button class="danger" data-del="${e.id}">削除</button></div></div>`).join('')}
function render(){let d=$('day').value;$('heading').textContent=d+' の予定';list(events.filter(e=>e.date===d).sort((a,b)=>a.time.localeCompare(b.time)),$('todayList'));list([...events].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)),$('allList'))}
function tab(t){['today','add','all'].forEach(x=>$(x).classList.toggle('hidden',x!==t));document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));if(t!=='add')render()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));$('day').onchange=render;
function reset(){editing=null;$('form').reset();$('date').value=today();$('time').value='09:00';$('formHeading').textContent='新しい予定';$('cancel').classList.add('hidden')}
$('form').onsubmit=e=>{e.preventDefault();let x={id:editing||crypto.randomUUID(),title:$('title').value.trim(),date:$('date').value,time:$('time').value,category:$('category').value,memo:$('memo').value.trim()};if(!x.title)return;if(editing)events=events.map(a=>a.id===editing?x:a);else events.push(x);save();reset();$('day').value=x.date;tab('today')};
$('cancel').onclick=()=>{reset();tab('today')};
document.addEventListener('click',e=>{let d=e.target.closest('[data-del]'),a=e.target.closest('[data-edit]');if(d&&confirm('この予定を削除しますか？')){events=events.filter(x=>x.id!==d.dataset.del);save()}if(a){let x=events.find(x=>x.id===a.dataset.edit);if(!x)return;editing=x.id;$('title').value=x.title;$('date').value=x.date;$('time').value=x.time;$('category').value=x.category;$('memo').value=x.memo;$('formHeading').textContent='予定を編集';$('cancel').classList.remove('hidden');tab('add')}});
$('day').value=today();$('date').value=today();load();render();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
